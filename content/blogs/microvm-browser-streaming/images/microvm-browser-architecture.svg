<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MicroVM browser streaming architecture</title>
  <desc id="desc">A user and AI agent connect through a Flutter chat UI and Rust sandbox helper to a Node.js browser broker and Chromium inside an isolated Ubuntu microVM.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#17112b"/></linearGradient>
    <linearGradient id="host" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d4ed8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="vm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".22"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/></marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" rx="32"/>
  <text x="60" y="70" fill="#f8fafc" font-size="31" font-family="Inter, Arial, sans-serif" font-weight="700">An AI browser, streamed from a microVM into chat</text>
  <text x="60" y="105" fill="#a5b4fc" font-size="17" font-family="Inter, Arial, sans-serif">A rough but working experiment in visible, interruptible agent browsing</text>
  <rect x="60" y="155" width="490" height="390" rx="24" fill="url(#host)" opacity=".96" filter="url(#shadow)"/>
  <text x="90" y="198" fill="#dbeafe" font-size="17" font-family="Inter, Arial, sans-serif" font-weight="700" letter-spacing="2">HOST APPLICATION</text>
  <rect x="90" y="230" width="205" height="104" rx="16" fill="#eff6ff"/>
  <text x="112" y="266" fill="#1e3a8a" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="700">Flutter chat UI</text>
  <text x="112" y="294" fill="#475569" font-size="14" font-family="Inter, Arial, sans-serif">Preview · Take over · Resume</text>
  <rect x="315" y="230" width="205" height="104" rx="16" fill="#eff6ff"/>
  <text x="338" y="266" fill="#1e3a8a" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="700">AI agent</text>
  <text x="338" y="294" fill="#475569" font-size="14" font-family="Inter, Arial, sans-serif">Typed browser actions</text>
  <rect x="175" y="393" width="260" height="104" rx="16" fill="#dbeafe"/>
  <text x="205" y="433" fill="#1e3a8a" font-size="19" font-family="Inter, Arial, sans-serif" font-weight="700">Rust sandbox helper</text>
  <text x="205" y="460" fill="#475569" font-size="14" font-family="Inter, Arial, sans-serif">Authenticated local transport</text>
  <rect x="650" y="155" width="490" height="390" rx="24" fill="url(#vm)" opacity=".96" filter="url(#shadow)"/>
  <text x="680" y="198" fill="#ccfbf1" font-size="17" font-family="Inter, Arial, sans-serif" font-weight="700" letter-spacing="2">ISOLATED UBUNTU MICROVM</text>
  <rect x="680" y="260" width="190" height="120" rx="16" fill="#ecfdf5"/>
  <text x="707" y="305" fill="#065f46" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="700">Node.js broker</text>
  <text x="707" y="334" fill="#475569" font-size="14" font-family="Inter, Arial, sans-serif">Validates actions</text>
  <text x="707" y="355" fill="#475569" font-size="14" font-family="Inter, Arial, sans-serif">Captures frames</text>
  <rect x="920" y="260" width="180" height="120" rx="16" fill="#ecfdf5"/>
  <text x="953" y="305" fill="#065f46" font-size="19" font-family="Inter, Arial, sans-serif" font-weight="700">Chromium</text>
  <text x="953" y="334" fill="#475569" font-size="14" font-family="Inter, Arial, sans-serif">Renders the page</text>
  <text x="953" y="355" fill="#475569" font-size="14" font-family="Inter, Arial, sans-serif">Runs page JS</text>
  <line x1="295" y1="282" x2="315" y2="282" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="422" y1="334" x2="352" y2="393" stroke="#bfdbfe" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="235" y1="334" x2="290" y2="393" stroke="#bfdbfe" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="435" y1="445" x2="678" y2="445" stroke="#9ca3af" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <text x="481" y="425" fill="#d1d5db" font-size="14" font-family="Inter, Arial, sans-serif">Actions · snapshots · frames</text>
  <line x1="870" y1="320" x2="918" y2="320" stroke="#6ee7b7" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="870" y="247" fill="#d1fae5" font-size="14" font-family="Inter, Arial, sans-serif">CDP WebSocket</text>
  <text x="60" y="590" fill="#94a3b8" font-size="15" font-family="Inter, Arial, sans-serif">The agent reads accessibility snapshots. The user sees JPEG preview frames.</text>
</svg>
